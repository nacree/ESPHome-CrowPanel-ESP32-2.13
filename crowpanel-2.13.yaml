esphome:
  name: crowpanel
  friendly_name: CrowPanel 2.13

external_components:
  - source:
      type: local
      path: components

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key
  # Draw as soon as Home Assistant has handed over the subscribed values, rather than waiting out
  # the first update_interval.
  on_client_connected:
    then:
      - delay: 2s
      - component.update: epaper

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Crowpanel Fallback Hotspot"
    password: !secret ap_password

captive_portal:

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_medium
    size: 17
  - file: "gfonts://Roboto@500"
    id: font_hero
    size: 48

# Values pulled from Home Assistant over the native API. Replace the entity IDs with your own.
time:
  - platform: homeassistant
    id: ha_time

sensor:
  - platform: homeassistant
    id: outdoor_temperature
    entity_id: sensor.outdoor_temperature
  - platform: homeassistant
    id: outdoor_humidity
    entity_id: sensor.outdoor_humidity
  - platform: homeassistant
    id: indoor_temperature
    entity_id: sensor.living_room_temperature

display:
  - platform: crowpanel_epaper
    id: epaper
    cs_pin: GPIO14
    dc_pin: GPIO13
    reset_pin: GPIO10
    busy_pin: GPIO9
    power_pin: GPIO7
    rotation: 270
    mirror_y: true
    full_update_every: 1
    update_interval: 5min
    lambda: |-
      // Canvas is 250 x 122 with rotation: 270. Outdoor temperature fills the left two thirds,
      // the two secondary values are stacked in the right column.
      it.print(4, 2, id(font_small), "Outdoor");
      if (id(ha_time).now().is_valid()) {
        it.strftime(246, 2, id(font_small), TextAlign::TOP_RIGHT, "%a %H:%M", id(ha_time).now());
      }
      it.line(0, 19, 250, 19);
      it.line(158, 19, 158, 121);

      if (id(outdoor_temperature).has_state()) {
        it.printf(79, 70, id(font_hero), TextAlign::CENTER, "%.1f°", id(outdoor_temperature).state);
      } else {
        it.print(79, 70, id(font_hero), TextAlign::CENTER, "--.-°");
      }

      it.print(164, 28, id(font_small), "Humidity");
      if (id(outdoor_humidity).has_state()) {
        it.printf(244, 43, id(font_medium), TextAlign::TOP_RIGHT, "%.0f%%", id(outdoor_humidity).state);
      } else {
        it.print(244, 43, id(font_medium), TextAlign::TOP_RIGHT, "--%");
      }

      it.print(164, 70, id(font_small), "Indoor");
      if (id(indoor_temperature).has_state()) {
        it.printf(244, 85, id(font_medium), TextAlign::TOP_RIGHT, "%.1f°", id(indoor_temperature).state);
      } else {
        it.print(244, 85, id(font_medium), TextAlign::TOP_RIGHT, "--.-°");
      }

# The board's front panel buttons and the power LED.
binary_sensor:
  - platform: gpio
    name: Menu
    pin:
      number: GPIO2
      inverted: true
  - platform: gpio
    name: Exit
    pin:
      number: GPIO1
      inverted: true
  - platform: gpio
    name: Up
    pin:
      number: GPIO6
      inverted: true
  - platform: gpio
    name: Down
    pin:
      number: GPIO4
      inverted: true
  - platform: gpio
    name: Confirm
    pin:
      number: GPIO5
      inverted: true

output:
  - platform: gpio
    id: power_led
    pin: GPIO19

light:
  - platform: binary
    name: Power LED
    output: power_led
    restore_mode: ALWAYS_ON
